name: Scrape Data

on:
  workflow_dispatch:
  schedule:
    # Chạy lúc 11:00 AM (11h trưa giờ Việt Nam, tức 04:00 UTC) vào thứ 3 và thứ 6 hàng tuần
    - cron: '0 4 * * 2,5'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Create credentials file
        run: |
          cat <<EOF > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Verify credentials file
        run: |
          if [ ! -f credentials.json ]; then
            echo "credentials.json not found"
            exit 1
          fi
          echo "credentials.json exists, size: $(wc -c < credentials.json) bytes"

      - name: Install dependencies (clean & cached)
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: npm start ${{ secrets.BASE_URL }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
