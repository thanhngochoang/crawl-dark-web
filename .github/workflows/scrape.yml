name: Manual Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Create credentials file
      run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > credentials.json

    - name: Install dependencies
      run: npm install

    - name: Run scraper
      run: npm start